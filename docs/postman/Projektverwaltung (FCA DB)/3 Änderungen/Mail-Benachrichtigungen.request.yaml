$kind: http-request
description: ""
url: "{{baseUrl}}/graphql"
method: POST
body:
  type: graphql
  content:
    query: |
      mutation UpdateMyNotifications($emailEnabled: Boolean!) {
        updateMyNotifications(emailEnabled: $emailEnabled) { name notifyByEmail }
      }
    variables: |-
      {
        "emailEnabled": false
      }
order: 8000
