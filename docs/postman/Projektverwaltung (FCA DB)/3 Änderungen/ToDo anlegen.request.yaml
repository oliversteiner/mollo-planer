$kind: http-request
description: ""
url: "{{baseUrl}}/api"
method: POST
body:
  type: graphql
  content:
    query: |
      mutation CreateTodo($input: CreateTodoInput!) {
        createTodo(input: $input) { id title status milestone { title status } }
      }
    variables: |-
      {
        "input": {
          "milestoneId": "{{milestoneId}}",
          "title": "Bilder optimieren"
        }
      }
order: 2000
