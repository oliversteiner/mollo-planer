$kind: http-request
description: ""
url: "{{baseUrl}}/api"
method: POST
body:
  type: graphql
  content:
    query: |
      mutation UpdateMyNotifications($notifyByEmail: Boolean!) {
        updateMyNotifications(notifyByEmail: $notifyByEmail) { name notifyByEmail }
      }
    variables: |-
      {
        "notifyByEmail": false
      }
order: 8000
