"""
Formatierter Text als TipTap-Dokument (JSON-Objekt mit type "doc"). Der Server
speichert nie HTML, sondern prüft das Dokument gegen eine Whitelist:
Absatz, Überschrift (Ebene 2 und 3), Aufzählung, nummerierte Liste,
Zeilenumbruch, Zitat sowie fett, kursiv und Links (http, https, mailto).
Maximal 20000 Zeichen. Ein Dokument ohne Text wird als null gespeichert.
"""
scalar RichText

"Rechte, die der Code prüft (docs/rollen-funktionen-rechte.md, §4). Projektrechte gelten in einem Projekt, Systemrechte in der ganzen App. Welche Rolle ein Recht hat, steht in den Einstellungen (Rollen und Funktionen)."
enum Right {
  AI_CONTEXT_UPDATE
  ASSISTANT_USE
  COMMENT_CREATE
  COMMENT_MODERATE
  DATABASE_VIEW
  IDEAS_CREATE
  IDEAS_VIEW_ANY
  LABEL_SETS_MANAGE
  LABEL_SETS_MANAGE_ANY
  MEMBERS_MANAGE
  MILESTONE_CREATE
  MILESTONE_DELETE
  MILESTONE_UPDATE
  OWNER_MANAGE
  PLANER_EXPORT
  PLANER_IMPORT
  PROJECTS_CREATE
  PROJECTS_MANAGE_ANY
  PROJECTS_VIEW_ALL
  PROJECT_ARCHIVE
  PROJECT_DELETE
  PROJECT_UPDATE
  ROLES_MANAGE
  SETTINGS_MANAGE
  SYSTEM_VIEW
  TASK_ASSIGN
  TASK_ASSIGN_SELF
  TASK_CREATE
  TASK_DELETE
  TASK_MOVE
  TASK_UPDATE
  TASK_UPDATE_OWN
  TEMPLATES_MANAGE
  TEMPLATES_MANAGE_ANY
  TODO_CREATE
  TODO_DELETE
  TODO_UPDATE
  TRASH_PURGE
  TRASH_RESTORE
  USERS_MANAGE
}

"Eine Rolle: ein benanntes Bündel von Funktionen. Systemrollen gelten für eine Person in der ganzen App, Projektrollen für eine Mitgliedschaft. Siehe docs/rollen-funktionen-rechte.md."
type Role {
  "Die Funktionen der Rolle"
  functions: [RoleFunction!]!

  id: ID!

  "Rolle für neue Personen (System) bzw. neue Mitglieder (Projekt)"
  isDefault: Boolean!

  "Mit der App geliefert (zurücksetzbar), nicht in den Einstellungen angelegt"
  isStandard: Boolean!

  "Fester Schlüssel, zum Beispiel manager. Eingaben und die Planer-Datei (members[].role) nennen die Rolle damit."
  key: String!

  names: LocalizedName!

  "Obergrenze einer Systemrolle: die Projektrechte, die für die Person überhaupt wirken dürfen. null: alle (auch bei Projektrollen). Leere Liste: keine, die Person liest nur."
  projectCap: [Right!]

  "Die Rechte, die die Rolle über ihre Funktionen gibt"
  rights: [Right!]!

  scope: RoleScope!

  "Wie oft die Rolle vergeben ist (Personen bzw. Mitgliedschaften). Eine vergebene Rolle lässt sich nicht löschen. Nur mit dem Recht roles.manage."
  usageCount: Int!
}

"Eine Funktion: ein benanntes Bündel von Rechten eines Bereichs. Rollen bestehen aus Funktionen. Siehe docs/rollen-funktionen-rechte.md."
type RoleFunction {
  id: ID!

  "Mit der App geliefert (zurücksetzbar), nicht in den Einstellungen angelegt"
  isStandard: Boolean!

  "Fester Schlüssel, zum Beispiel manage-tasks"
  key: String!

  names: LocalizedName!
  rights: [Right!]!
  scope: RoleScope!

  "Wie viele Rollen die Funktion verwenden. Eine verwendete Funktion lässt sich nicht löschen."
  usageCount: Int!
}

"Bereich einer Rolle: System (ganze App) oder Projekt (eine Mitgliedschaft)"
enum RoleScope {
  PROJECT
  SYSTEM
}

