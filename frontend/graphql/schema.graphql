 name: String
}
"Datei-Upload (GraphQL multipart request), zum Beispiel mit apollo-upload-client"
scalar Upload
"Eine Person mit Zugang. Anlegen und Löschen nur durch Admins."
type User {
 "Deine Zugänge für Claude (MCP), neueste zuerst. Nur für dich selbst, sonst null."
 apiTokens: [ApiToken!]
 "Zugewiesene Tasks, soweit du sie sehen darfst"
 assignedTasks: [Task!]!
 "Adresse des Avatarbilds (500 x 500 Pixel, WebP). null = kein Bild, das Frontend zeigt dann zum Beispiel die Initialen."
 avatarUrl: String
 createdAt: DateTime!
 email: String!
 "Hat die Person mindestens einen Passkey? Nur für dich selbst und für Admins, sonst null."
 hasPasskey: Boolean
 id: ID!
 "Globale Admin-Rolle, unabhängig von Projekten"
 isAdmin: Boolean!
 name: String!
 "Will diese Person E-Mail-Benachrichtigungen? Standard: ja. Ändern nur sie selbst."
 notifyByEmail: Boolean!
 "Deine Passkeys, neueste zuerst. Nur für dich selbst, sonst null. Hinzufügen und Entfernen über die Passkey-Routen (REST)."
 passkeys: [Passkey!]
 "Projekte dieser Person, soweit du sie sehen darfst"
 projects: [Project!]!
 "Hat die Person eine bestätigte 2FA-App? Nur für dich selbst und für Admins, sonst null."
 twoFactorConfirmed: Boolean
}

