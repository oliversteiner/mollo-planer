query ListProjects($archived: Boolean, $includeMembers: Boolean! = false, $includeRights: Boolean! = false) {
    projects(archived: $archived) {
        id name locale archivedAt planerRevision viewerRole { key }
        progress { done total percent }
        viewerRights @include(if: $includeRights)
        members @include(if: $includeMembers) { role { key } user { id name email } }
    }
}
