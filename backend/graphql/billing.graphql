# ─── Abrechnung (Auftrag 39): Kunden, Absender, Preise, Rechnungen ───
#
# Alles nur mit dem Systemrecht billing.manage, unabhängig von den Rollen im
# Projekt. Ohne das Recht sind Project.customer und Milestone.priceCents null.
# Agent-Konten haben das Recht nie. Beträge immer in ganzen Rappen.

"Kunde der Abrechnung. Strukturierte Adresse, wie sie die QR-Rechnung verlangt."
type Customer {
  id: ID!
  "Firma, optional"
  company: String
  name: String!
  street: String!
  houseNumber: String @rename(attribute: "house_number")
  postalCode: String! @rename(attribute: "postal_code")
  city: String!
  "Land als ISO-Code mit zwei Buchstaben, zum Beispiel CH"
  country: String!
  email: String
  "Sprache der Rechnungen an diesen Kunden"
  locale: Locale!
  "Interne Notiz, erscheint nie auf einer Rechnung"
  notes: String
  archived: Boolean! @method(name: "isArchived")
  archivedAt: DateTime @rename(attribute: "archived_at")
  "Projekte des Kunden, auch archivierte"
  projects: [Project!]! @hasMany
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Absender der Rechnungen und Bedingungen. Pflicht für eine Rechnung: Name, Strasse, PLZ, Ort, Land, IBAN."
type BillingSettings {
  name: String
  street: String
  houseNumber: String @rename(attribute: "house_number")
  postalCode: String @rename(attribute: "postal_code")
  city: String
  country: String!
  email: String
  phone: String
  website: String
  "IBAN der Schweiz oder Liechtensteins (keine QR-IBAN)"
  iban: String
  "UID, leer erlaubt (ohne MWST)"
  uid: String
  "Zahlungsfrist in Tagen ab Ausstelldatum"
  paymentTermsDays: Int! @rename(attribute: "payment_terms_days")
  "Format der Rechnungsnummer, Platzhalter {YYYY} (Jahr) und {NNNN} (laufende Nummer, Anzahl N = Stellen)"
  numberFormat: String! @rename(attribute: "number_format")
  "Pflichtfelder, die noch leer sind (Feldnamen wie hier, zum Beispiel iban). Leer: bereit für Rechnungen."
  missingFields: [String!]! @method(name: "missingFields")
}

input CustomerInput @validator {
  company: String
  name: String!
  street: String!
  houseNumber: String @rename(attribute: "house_number")
  postalCode: String! @rename(attribute: "postal_code")
  city: String!
  country: String!
  email: String
  locale: Locale!
  notes: String
}

input BillingSettingsInput @validator {
  name: String
  street: String
  houseNumber: String @rename(attribute: "house_number")
  postalCode: String @rename(attribute: "postal_code")
  city: String
  country: String!
  email: String
  phone: String
  website: String
  iban: String
  uid: String
  paymentTermsDays: Int! @rename(attribute: "payment_terms_days")
  numberFormat: String! @rename(attribute: "number_format")
}

"Stand einer Rechnung. Überfällig ist kein Status, sondern abgeleitet (Invoice.overdue)."
enum InvoiceStatus {
  "Entwurf: änderbar, ohne Nummer, darf gelöscht werden"
  DRAFT @enum(value: "draft")
  "Ausgestellt: Nummer vergeben, eingefroren, PDF gespeichert"
  ISSUED @enum(value: "issued")
  PAID @enum(value: "paid")
  "Storniert: Nummer bleibt belegt, die Meilensteine sind wieder verrechenbar"
  CANCELLED @enum(value: "cancelled")
}

"Adresse, wie sie beim Ausstellen auf der Rechnung eingefroren wurde"
type InvoiceAddress {
  company: String
  name: String!
  street: String!
  houseNumber: String
  postalCode: String!
  city: String!
  country: String!
}

"Absender, wie er beim Ausstellen auf der Rechnung eingefroren wurde"
type InvoiceSender {
  name: String!
  street: String!
  houseNumber: String
  postalCode: String!
  city: String!
  country: String!
  email: String
  phone: String
  website: String
  iban: String!
  uid: String
}

"Eine Position: ein Meilenstein zum Fixpreis. Projektname, Titel, Text und Betrag sind Kopien."
type InvoiceItem {
  id: ID!
  "null, wenn das Projekt inzwischen endgültig gelöscht ist"
  projectId: ID @rename(attribute: "project_id")
  projectName: String! @rename(attribute: "project_name")
  "null, wenn der Meilenstein inzwischen endgültig gelöscht ist"
  milestoneId: ID @rename(attribute: "milestone_id")
  position: Int!
  title: String!
  "Klartext, im Entwurf änderbar"
  description: String
  amountCents: Int! @rename(attribute: "amount_cents")
  invoice: Invoice! @belongsTo
}

type Invoice {
  id: ID!
  "Rechnungsnummer, leer im Entwurf"
  number: String
  status: InvoiceStatus!
  "Ausgestellt und die Fälligkeit ist vorbei"
  overdue: Boolean! @method(name: "isOverdue")
  customer: Customer! @belongsTo
  issueDate: Date @rename(attribute: "issue_date")
  dueDate: Date @rename(attribute: "due_date")
  currency: String!
  totalCents: Int! @rename(attribute: "total_cents")
  "Empfänger beim Ausstellen, null im Entwurf (dann gilt die Adresse des Kunden)"
  recipient: InvoiceAddress
  "Absender beim Ausstellen, null im Entwurf"
  sender: InvoiceSender
  "Creditor Reference (RF…), aus der Nummer"
  reference: String
  "Sprache der Rechnung (Sprache des Kunden)"
  locale: Locale!
  "Text auf der Rechnung"
  notes: String
  items: [InvoiceItem!]! @hasMany
  "Die gespeicherte PDF ist da (nur bei ausgestellten Rechnungen)"
  hasPdf: Boolean! @field(resolver: "App\\GraphQL\\Billing\\InvoiceQueries@hasPdf")
  createdBy: User @belongsTo
  issuedBy: User @belongsTo
  issuedAt: DateTime @rename(attribute: "issued_at")
  paidAt: Date @rename(attribute: "paid_at")
  cancelledAt: DateTime @rename(attribute: "cancelled_at")
  cancelReason: String @rename(attribute: "cancel_reason")
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Summen über alle ausgestellten, nicht bezahlten Rechnungen"
type InvoiceTotals {
  openCount: Int!
  openCents: Int!
  overdueCount: Int!
  overdueCents: Int!
}

"Ein verrechenbarer Meilenstein"
type BillableMilestone {
  id: ID!
  title: String!
  priceCents: Int!
  dueDate: Date
  releaseVersion: String
}

type BillableProject {
  projectId: ID!
  projectName: String!
  totalCents: Int!
  milestones: [BillableMilestone!]!
}

"Verrechenbares eines Kunden, nach Projekt"
type BillableGroup {
  customer: Customer!
  totalCents: Int!
  projects: [BillableProject!]!
}

"Hinweis: erledigt, aber nicht verrechenbar, weil dem Projekt der Kunde oder dem Meilenstein der Preis fehlt"
type BillingHint {
  projectId: ID!
  projectName: String!
  milestoneId: ID!
  milestoneTitle: String!
}

type BillingOverview {
  groups: [BillableGroup!]!
  "Erledigte, unverrechnete Meilensteine in Projekten ohne Kunde"
  withoutCustomer: [BillingHint!]!
  "Erledigte, unverrechnete Meilensteine ohne Preis (Projekt mit Kunde)"
  withoutPrice: [BillingHint!]!
}

input InvoiceItemInput {
  id: ID!
  description: String @rules(apply: ["nullable", "max:2000"])
}

"Satzspiegel eines Briefs in mm (Basis, Auftrag 39 F)"
type PdfLayout {
  "Textbeginn Seite 1, von oben"
  topFirst: Float!
  "Textbeginn der Folgeseiten, von oben"
  topFollowing: Float!
  "Textende, vom unteren Rand"
  bottom: Float!
  left: Float!
  right: Float!
  "Adressfeld: Abstand von links"
  addressLeft: Float!
  "Adressfeld: Abstand von oben"
  addressTop: Float!
  addressWidth: Float!
  addressHeight: Float!
}

"Hochgeladenes Briefpapier"
type Letterhead {
  fileName: String!
  "1: nur Seite 1; 2: Seite 1 und Folgeseiten"
  pages: Int!
  uploadedAt: DateTime!
}

type PdfFont {
  key: String!
  name: String!
}

"Briefpapier, Satzspiegel und Schrift für PDFs (Rechnungen; Dokumente auf Wunsch)"
type PdfFrame {
  letterhead: Letterhead
  layout: PdfLayout!
  "Schrift des Texts (Schlüssel aus fonts)"
  font: String!
  fonts: [PdfFont!]!
  "Fenster des Couverts: left oder right"
  addressWindow: String!
  "Vorgaben des Satzspiegels (Anleitung docs/briefpapier/)"
  defaults: PdfLayout!
}

input PdfLayoutInput {
  topFirst: Float!
  topFollowing: Float!
  bottom: Float!
  left: Float!
  right: Float!
  addressLeft: Float!
  addressTop: Float!
  addressWidth: Float!
  addressHeight: Float!
}

input PdfFrameInput @validator {
  layout: PdfLayoutInput!
  font: String!
  addressWindow: String!
}

extend type Project {
  "Kunde, dem das Projekt verrechnet wird. Nur mit billing.manage, sonst null."
  customer: Customer
    @canModel(ability: "manage", model: "App\\Models\\BillingSetting", action: RETURN_VALUE, returnValue: null)
    @belongsTo
}

extend type Milestone {
  "Fixpreis in Rappen. null: kein Preis, nicht verrechenbar. Nur mit billing.manage, sonst null."
  priceCents: Int
    @canModel(ability: "manage", model: "App\\Models\\BillingSetting", action: RETURN_VALUE, returnValue: null)
    @rename(attribute: "price_cents")
  "Die Position der Rechnung, die den Meilenstein hält (Entwurf, ausgestellt oder bezahlt). Nur mit billing.manage, sonst null."
  billing: InvoiceItem
    @canModel(ability: "manage", model: "App\\Models\\BillingSetting", action: RETURN_VALUE, returnValue: null)
    @hasOne(relation: "billingItem")
}

extend type Query @guard {
  "Kunden, nach Name. Ohne archived nur die aktiven, mit archived: true nur die archivierten."
  customers(archived: Boolean = false): [Customer!]!
    @can(ability: "viewAny", model: "App\\Models\\Customer")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerQueries@customers")
  customer(id: ID! @whereKey): Customer
    @can(ability: "viewAny", model: "App\\Models\\Customer")
    @find
  "Absender und Bedingungen der Abrechnung"
  billingSettings: BillingSettings!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\BillingSettingsMutations@current")
  "Verrechenbare Meilensteine nach Kunde und Projekt, mit Summen und Hinweisen. Mit customerId nur dieser Kunde."
  billingOverview(customerId: ID): BillingOverview!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceQueries@overview")
  "Rechnungen, neueste zuerst (Entwürfe vorne). year filtert nach Ausstelldatum (Entwürfe fallen dann weg)."
  invoices(status: InvoiceStatus, customerId: ID, year: Int): [Invoice!]!
    @can(ability: "viewAny", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceQueries@invoices")
  invoice(id: ID! @whereKey): Invoice
    @can(ability: "viewAny", model: "App\\Models\\Invoice")
    @find
  "Briefpapier, Satzspiegel und Schrift (Abrechnung, Einstellungen)"
  pdfFrame: PdfFrame!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@current")
  "Ist ein Briefpapier hochgeladen? Für die Option beim PDF-Export der Dokumente, ohne Recht der Abrechnung."
  letterheadAvailable: Boolean!
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@available")
  invoiceTotals: InvoiceTotals!
    @can(ability: "viewAny", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceQueries@totals")
}

extend type Mutation @guard {
  createCustomer(input: CustomerInput!): Customer!
    @can(ability: "create", model: "App\\Models\\Customer")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerMutations@create")
  "Ersetzt alle Angaben des Kunden. Ausgestellte Rechnungen behalten ihre Adresse."
  updateCustomer(id: ID!, input: CustomerInput!): Customer!
    @can(ability: "update", model: "App\\Models\\Customer")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerMutations@update")
  "Archiviert einen Kunden oder holt ihn zurück. Kunden werden nicht gelöscht."
  archiveCustomer(id: ID!, archived: Boolean!): Customer!
    @can(ability: "update", model: "App\\Models\\Customer")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerMutations@archive")
  "Kunde des Projekts setzen oder (null) entfernen. Nur aktive Kunden."
  setProjectCustomer(projectId: ID!, customerId: ID): Project!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerMutations@setProjectCustomer")
  "Fixpreis des Meilensteins in Rappen setzen oder (null) entfernen. 0 bis 999 999 999 (Grenze der QR-Rechnung)."
  setMilestonePrice(milestoneId: ID!, priceCents: Int @rules(apply: ["nullable", "integer", "min:0", "max:999999999"])): Milestone!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\CustomerMutations@setMilestonePrice")
  "Absender und Bedingungen ändern. Braucht eine frische Passwortbestätigung."
  updateBillingSettings(input: BillingSettingsInput!): BillingSettings!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\BillingSettingsMutations@update")
  "Neuer Entwurf aus verrechenbaren Meilensteinen eines Kunden (auch aus mehreren Projekten). Fehlercodes in extensions.code: MILESTONE_NOT_BILLABLE, OTHER_CUSTOMER, CUSTOMER_MISSING, INVOICE_EMPTY, INVOICE_TOTAL_TOO_HIGH."
  createInvoiceDraft(customerId: ID!, milestoneIds: [ID!]!, notes: String @rules(apply: ["nullable", "max:2000"])): Invoice!
    @can(ability: "create", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@createDraft")
  "Ändert einen Entwurf. notes: Text auf der Rechnung. items: die Positionen, die bleiben, in dieser Reihenfolge, mit ihrem Text; fehlende werden entfernt."
  updateInvoiceDraft(id: ID!, notes: String @rules(apply: ["nullable", "max:2000"]), items: [InvoiceItemInput!]): Invoice!
    @can(ability: "update", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@updateDraft")
  "Löscht einen Entwurf. Ausgestellte Rechnungen werden nie gelöscht."
  deleteInvoiceDraft(id: ID!): ID!
    @can(ability: "update", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@deleteDraft")
  "Stellt aus: Nummer, Einfrieren, PDF speichern. Endgültig. Ohne issueDate gilt heute. Fehlercodes: SENDER_INCOMPLETE (missingFields), MILESTONE_NOT_BILLABLE, INVOICE_WRONG_STATUS."
  issueInvoice(id: ID!, issueDate: Date): Invoice!
    @can(ability: "update", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@issue")
  "Ausgestellte Rechnung als bezahlt markieren"
  markInvoicePaid(id: ID!, paidAt: Date!): Invoice!
    @can(ability: "update", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@markPaid")
  "Storniert eine ausgestellte Rechnung mit Grund. Die Nummer bleibt belegt, die Meilensteine werden wieder verrechenbar."
  cancelInvoice(id: ID!, reason: String! @rules(apply: ["required", "min:3", "max:500"])): Invoice!
    @can(ability: "update", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@cancel")
  "Die gespeicherte PDF einer ausgestellten Rechnung (auch bezahlt oder storniert). Nie neu erzeugt. Nicht für Entwürfe (INVOICE_WRONG_STATUS)."
  exportInvoicePdf(id: ID!): DocumentFile!
    @can(ability: "viewAny", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@exportPdf")
  "Vorschau eines Entwurfs als PDF mit dem Wasserzeichen ENTWURF, ohne Nummer und ohne Speichern. Fehlercode SENDER_INCOMPLETE (missingFields)."
  previewInvoicePdf(id: ID!): DocumentFile!
    @can(ability: "viewAny", model: "App\\Models\\Invoice")
    @field(resolver: "App\\GraphQL\\Billing\\InvoiceMutations@previewPdf")
  "Lädt das Briefpapier hoch (PDF, A4 hochkant, 1 oder 2 Seiten, höchstens 5 MB, von FPDI lesbar) und ersetzt das bisherige. Frische Passwortbestätigung. Fehlercodes: LETTERHEAD_NOT_PDF, LETTERHEAD_TOO_LARGE, LETTERHEAD_NOT_READABLE, LETTERHEAD_NOT_A4, LETTERHEAD_PAGES."
  uploadLetterhead(file: Upload!): PdfFrame!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@upload")
  "Entfernt das Briefpapier. Frische Passwortbestätigung."
  removeLetterhead: PdfFrame!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@remove")
  "Satzspiegel, Schrift und Fenster des Couverts. Frische Passwortbestätigung."
  updatePdfFrame(input: PdfFrameInput!): PdfFrame!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@update")
  "Musterrechnung mit Testdaten, mit Briefpapier, Satzspiegel und Schrift von jetzt"
  sampleInvoicePdf(locale: Locale): DocumentFile!
    @can(ability: "manage", model: "App\\Models\\BillingSetting")
    @field(resolver: "App\\GraphQL\\Billing\\PdfFrameMutations@sample")
}
