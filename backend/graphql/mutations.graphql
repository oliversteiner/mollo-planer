# Änderungen (Mutation)

# ─── Änderungen ─────────────────────────────────────────────────

type Mutation @guard {
  # Benutzer: nur Admins. Neue Benutzer bekommen eine Einladungsmail
  # mit Link zum Setzen des Passworts.
  createUser(input: CreateUserInput! @spread): User!
    @can(ability: "create", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateUser")
  "Ein Admin kann sich die Admin-Rolle nicht selbst entziehen. Eine geänderte E-Mail darf noch nicht vergeben sein."
  updateUser(id: ID!, input: UpdateUserInput! @spread): User!
    @can(ability: "update", find: "id", injectArgs: true)
    @validator
    @update
  "Entfernt 2FA-Gerät und Passkeys (zum Beispiel bei verlorenem Gerät). Beim nächsten Login wird ein neuer zweiter Faktor eingerichtet."
  resetUserTwoFactor(id: ID!): User!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\ResetUserTwoFactor")
  "Gibt ein selbst registriertes Konto frei, nachdem die E-Mail bestätigt ist. Nur Admins."
  approveUser(id: ID!): User!
    @can(ability: "approve", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\ApproveUser")
  "Lehnt ein wartendes Konto ab und löscht es. Gibt wie deleteUser die Person zurück (vor dem Löschen gelesen). Freigegebene Konten löscht deleteUser."
  rejectUser(id: ID!): User!
    @can(ability: "reject", find: "id", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\RejectUser")
  deleteUser(id: ID! @whereKey): User!
    @can(ability: "delete", find: "id")
    @validator
    @delete
  "Schaltet die E-Mail-Benachrichtigungen für dich selbst an oder aus"
  updateMyNotifications(notifyByEmail: Boolean!): User!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateMyNotifications")

  "Setzt dein Avatarbild: JPG oder PNG, höchstens 5 MB. Es wird quadratisch auf 500 x 500 Pixel zugeschnitten."
  updateMyAvatar(avatar: Upload!): User!
    @validator
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateMyAvatar")
  "Entfernt ein Avatarbild: dein eigenes, als Admin auch das einer anderen Person."
  deleteUserAvatar(id: ID!): User!
    @can(ability: "deleteAvatar", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteUserAvatar")

  "Erzeugt einen Zugang für Claude (MCP), 90 Tage gültig. Den Klartext gibt es nur in der Antwort."
  createApiToken(name: String! @rules(apply: ["min:2", "max:60"])): NewApiToken!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateApiToken")
  "Widerruft einen eigenen Zugang für Claude. null, wenn es ihn nicht (mehr) gibt."
  deleteApiToken(id: ID!): ApiToken
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteApiToken")

  # Einstellungen der App: nur Admins.
  "Schaltet die 2FA für alle an oder aus (aus: Passwort genügt, kein Code). Nur ausserhalb Produktion, sonst ein Validierungsfehler."
  updateAppSettings(twoFactorEnabled: Boolean!): AppSettings!
    @can(ability: "updateAppSettings", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateAppSettings")
  "Legt fest, welche Projektrolle die Person bekommt, die ein Projekt anlegt. Die Rolle muss project.delete haben, sonst bleibt das Projekt ohne Löschrecht."
  setProjectCreatorRole(roleKey: String!): AppSettings!
    @can(ability: "updateAppSettings", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\SetProjectCreatorRole")

  # Rollen und Funktionen (Einstellungen, Recht roles.manage). Jede Änderung
  # wird gegen die Grundregeln geprüft (docs/rollen-funktionen-rechte.md, §7):
  # jemand behält users.manage und roles.manage, niemand nimmt sie sich
  # selbst, kein Projekt verliert die letzte Person mit project.delete.
  # Mitgeliefertes lässt sich ändern und zurücksetzen, aber nicht löschen.
  "Legt eine eigene Rolle an. Der Schlüssel entsteht aus dem englischen Namen."
  createRole(input: CreateRoleInput!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@create")
  "Ändert Namen, Funktionen oder Obergrenze einer Rolle. Der Schlüssel bleibt."
  updateRole(id: ID!, input: UpdateRoleInput!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@update")
  "Kopiert eine Rolle mit ihren Funktionen als eigene Rolle."
  duplicateRole(id: ID!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@duplicate")
  "Löscht eine eigene Rolle, die niemand hat und die weder Standardrolle noch Ersteller-Rolle ist."
  deleteRole(id: ID!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@delete")
  "Macht die Rolle zur Standardrolle ihres Bereichs: für neue Personen (System) bzw. neue Mitglieder (Projekt)."
  setDefaultRole(id: ID!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@setDefault")
  "Standard wiederherstellen: Namen, Funktionen und Obergrenze einer mitgelieferten Rolle."
  resetRole(id: ID!): Role!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoles@reset")
  "Legt eine eigene Funktion an. Der Schlüssel entsteht aus dem englischen Namen."
  createRoleFunction(input: CreateRoleFunctionInput!): RoleFunction!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoleFunctions@create")
  "Ändert Namen oder Rechte einer Funktion. Wirkt sofort für alle Rollen, die sie verwenden."
  updateRoleFunction(id: ID!, input: UpdateRoleFunctionInput!): RoleFunction!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoleFunctions@update")
  "Kopiert eine Funktion mit ihren Rechten als eigene Funktion. Keine Rolle verwendet die Kopie."
  duplicateRoleFunction(id: ID!): RoleFunction!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoleFunctions@duplicate")
  "Löscht eine eigene Funktion, die keine Rolle mehr verwendet."
  deleteRoleFunction(id: ID!): RoleFunction!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoleFunctions@delete")
  "Standard wiederherstellen: Namen und Rechte einer mitgelieferten Funktion."
  resetRoleFunction(id: ID!): RoleFunction!
    @can(ability: "manageRoles", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\ManageRoleFunctions@reset")

  # Vorlagen: app-weit, alle Angemeldeten lesen sie. Anlegen und Duplizieren mit
  # templates.manage (Rolle); eigene ändert und löscht der Ersteller mit dieser
  # Fähigkeit, fremde mit templates.manageAny (Admin), mitgelieferte niemand.
  "Legt eine eigene Vorlage an: Name, Beschreibung, Sprache und Labels, ohne Gerüst."
  createTemplate(input: TemplateInput!): Template!
    @can(ability: "create", model: "App\\Models\\Template")
    @field(resolver: "App\\GraphQL\\Mutations\\SaveTemplate@create")
  "Legt aus einem Projekt eine eigene Vorlage an („Als Vorlage speichern“): Export mit den festen Werten einer Vorlage (keine Mitglieder, Fälligkeiten, Zuweisungen, Commits, alle Tasks geplant). Recht planer.export im Projekt und templates.manage. Das Projekt braucht mindestens ein Label."
  createTemplateFromProject(projectId: ID!, name: String!): Template!
    @field(resolver: "App\\GraphQL\\Mutations\\TemplateFromPlan@fromProject")
  "Legt aus einer hochgeladenen Planer-Datei (planer-v2, als JSON-Text) eine eigene Vorlage an. Der Name der Vorlage ist der Projektname der Datei. Recht templates.manage."
  createTemplateFromFile(document: String!): Template!
    @field(resolver: "App\\GraphQL\\Mutations\\TemplateFromPlan@fromFile")
  "Kopiert eine Vorlage (auch eine mitgelieferte) mit ihrem Gerüst als eigene Vorlage, um sie anzupassen."
  duplicateTemplate(id: ID!): Template!
    @can(ability: "duplicate", find: "id", model: "App\\Models\\Template")
    @field(resolver: "App\\GraphQL\\Mutations\\DuplicateTemplate")
  "Ändert Name, Beschreibung und Labels einer eigenen Vorlage in einem Zug. Labels mit Schlüssel bleiben, ohne Schlüssel kommen neu dazu, fehlende werden gelöscht."
  updateTemplate(id: ID!, input: UpdateTemplateInput!): Template!
    @can(ability: "update", find: "id", model: "App\\Models\\Template")
    @field(resolver: "App\\GraphQL\\Mutations\\SaveTemplate@update")
  "Löscht eine eigene Vorlage endgültig (kein Papierkorb). Projekte aus ihr behalten ihre Kopien."
  deleteTemplate(id: ID!): Boolean!
    @can(ability: "delete", find: "id", model: "App\\Models\\Template")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteTemplate")
  "Setzt die Labels eines Projekts in einem Zug (project.update). Labels mit Schlüssel bleiben und behalten ihre Tasks, ohne Schlüssel kommen neu dazu, fehlende werden gelöscht, auch an den Tasks. Zählt als eine Änderung der Planer-Datei."
  updateProjectLabels(projectId: ID!, labels: [LabelInput!]! @rulesForArray(apply: ["max:30"])): Project!
    @can(ability: "update", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateProjectLabels")
  "Übernimmt die Labels einer Vorlage in ein bestehendes Projekt (project.update): ersetzen oder ergänzen. Zählt als eine Änderung der Planer-Datei."
  applyTemplateLabels(projectId: ID!, templateId: ID!, mode: TemplateLabelMode!): Project!
    @can(ability: "update", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\ApplyTemplateLabels")
  "Setzt die Labels eines Tasks. Neue Labels müssen aus den Labels des Projekts stammen; bisherige dürfen bleiben."
  setTaskLabels(taskId: ID!, labelIds: [ID!]!): Task!
    @can(ability: "update", find: "taskId", model: "App\\Models\\Task")
    @field(resolver: "App\\GraphQL\\Mutations\\SetTaskLabels")

  # Projekte: Anlegen nur durch Admins, Löschen durch Admin oder Owner.
  createProject(input: CreateProjectInput! @spread): Project!
    @can(ability: "create", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateProject")
  updateProject(id: ID!, input: UpdateProjectInput! @spread): Project!
    @can(ability: "update", find: "id")
    @update
  deleteProject(id: ID! @whereKey): Project!
    @can(ability: "delete", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteProject")
  "Archiviert ein Projekt: danach nur lesbar, außer Zurückholen und Wiederherstellen aus dem Papierkorb. Fehlt in Dashboard, Seitenleiste und „Meine Tasks“."
  archiveProject(id: ID!): Project!
    @can(ability: "archive", find: "id", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\ArchiveProject@archive")
  "Holt ein archiviertes Projekt zurück."
  unarchiveProject(id: ID!): Project!
    @can(ability: "archive", find: "id", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\ArchiveProject@unarchive")
  "Trägt eine Planer-Datei (planer-v2, als JSON-Text) in ein Projekt ein, oder ohne projectId in ein neues Projekt (Recht projects.create). Recht planer.import im Projekt, jede einzelne Änderung prüft dazu ihr eigenes Recht. FULL: die Datei ist der ganze Plan, Fehlendes kommt als ein Vorgang in den Papierkorb, die Revision muss stimmen. PARTIAL: ergänzt und ändert, löscht nie. Mit dryRun wird nichts geschrieben, das Ergebnis zeigt, was geschähe. Alles oder nichts: bei Fehlern wird nichts geschrieben und errors nennt die Stellen."
  importPlan(
    projectId: ID
    document: String!
    mode: ImportMode = FULL
    dryRun: Boolean = false
    notifyAssignees: Boolean = false
  ): ImportResult!
    @field(resolver: "App\\GraphQL\\Mutations\\ImportPlan")
  "KI-Assistent (nur Admins): entwirft aus dem Chat einen Projektplan mit Claude. Speichert nichts."
  draftProjectPlan(
    messages: [PlanChatMessageInput!]! @rules(apply: ["min:1", "max:40"])
    "Der Entwurf in der Vorschau, damit Claude ihn ändert statt neu beginnt"
    currentPlan: ProjectPlanInput
  ): ProjectPlanDraft!
    @can(ability: "create", model: "App\\Models\\Project")
    @throttle(name: "plan-assistant")
    @field(resolver: "App\\GraphQL\\Mutations\\DraftProjectPlan")
  "Trägt einen Entwurf ein: Projekt, Mitglieder, Milestones, ToDos, Tasks. Alles oder nichts."
  importProjectPlan(plan: ProjectPlanInput!, notifyAssignees: Boolean = false): Project!
    @can(ability: "create", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\ImportProjectPlan")
  "Fügt eine Person hinzu oder ändert ihre Rolle"
  setProjectMember(projectId: ID!, userId: ID!, role: String! @rules(apply: ["max:64"])): Project!
    @can(ability: "manageMembers", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\SetProjectMember")
  removeProjectMember(projectId: ID!, userId: ID!): Project!
    @can(ability: "manageMembers", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\RemoveProjectMember")

  # Milestones, ToDos, Tasks: Wer was darf, steht in der Rechte-Tabelle.
  # Die Ability-Namen sind die Methoden der Policies.
  createMilestone(input: CreateMilestoneInput! @spread): Milestone!
    @can(ability: "createMilestone", find: "project_id", model: "App\\Models\\Project")
    @create
  updateMilestone(id: ID!, input: UpdateMilestoneInput! @spread): Milestone!
    @can(ability: "update", find: "id")
    @update
  "Verschiebt einen Milestone an eine andere Stelle im Projekt. Die übrigen rücken nach; ihre Titel und Inhalte bleiben."
  moveMilestone(id: ID!, position: Int! @rules(apply: ["integer", "min:0"])): Milestone!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveMilestone")
  deleteMilestone(id: ID! @whereKey): Milestone!
    @can(ability: "delete", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteMilestone")

  createTodo(input: CreateTodoInput! @spread): Todo!
    @can(ability: "createTodo", find: "milestone_id", model: "App\\Models\\Milestone")
    @create
  updateTodo(id: ID!, input: UpdateTodoInput! @spread): Todo!
    @can(ability: "update", find: "id")
    @update
  moveTodo(id: ID!, milestoneId: ID!, position: Int! @rules(apply: ["integer", "min:0"])): Todo!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTodo")
  deleteTodo(id: ID! @whereKey): Todo!
    @can(ability: "delete", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteTodo")

  "Legt einen Task zu einem ToDo an. Eine zugewiesene Person muss Mitglied des Projekts sein."
  createTask(input: CreateTaskInput! @spread): Task!
    @can(ability: "createTask", find: "todo_id", model: "App\\Models\\Todo")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateTask")
  updateTask(id: ID!, input: UpdateTaskInput! @spread): Task!
    @can(ability: "update", find: "id")
    @update
  "Weist einen Task zu. Ohne assigneeId wird die Zuweisung aufgehoben."
  assignTask(id: ID!, assigneeId: ID): Task!
    @can(ability: "assign", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\AssignTask")
  "Verschiebt einen Task im Kanban"
  moveTask(id: ID!, status: TaskStatus!, position: Int! @rules(apply: ["integer", "min:0"])): Task!
    @can(ability: "move", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTask")
  "Verschiebt einen Task an eine andere Stelle in seinem ToDo (Zeitachse). Die übrigen rücken nach; Status und Kanban-Platz bleiben."
  moveTaskInTodo(id: ID!, position: Int! @rules(apply: ["integer", "min:0"])): Task!
    @can(ability: "move", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTaskInTodo")
  "Verschiebt einen Task in ein anderes ToDo desselben Projekts (Zeitstrahl). Status von ToDos und Milestones rechnet der Observer nach."
  moveTaskToTodo(id: ID!, todoId: ID!): Task!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTaskToTodo")
  deleteTask(id: ID! @whereKey): Task!
    @can(ability: "delete", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteTask")

  # Kommentare: Alle Mitglieder dürfen kommentieren. Die Autorin oder der
  # Autor wird aus dem Login gesetzt, nicht aus der Eingabe.
  addComment(input: AddCommentInput! @spread): Comment!
    @can(ability: "createComment", find: "task_id", model: "App\\Models\\Task")
    @field(resolver: "App\\GraphQL\\Mutations\\AddComment")
  updateComment(id: ID!, input: UpdateCommentInput! @spread): Comment!
    @can(ability: "update", find: "id")
    @update
  deleteComment(id: ID! @whereKey): Comment!
    @can(ability: "delete", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteComment")

  # Papierkorb: Wer was darf, entscheidet die Policy des Elements, mit dem der Vorgang begann.
  "Holt einen Vorgang aus dem Papierkorb zurück (ans Ende der Liste bzw. Spalte). Abgelehnt, solange ein Elternteil im Papierkorb liegt. Gibt den Eintrag zurück, wie er im Papierkorb stand."
  restoreFromTrash(deletionId: ID!): TrashItem!
    @field(resolver: "App\\GraphQL\\Mutations\\TrashMutations@restore")
  "Löscht einen Vorgang endgültig."
  purgeFromTrash(deletionId: ID!): Boolean!
    @field(resolver: "App\\GraphQL\\Mutations\\TrashMutations@purge")
  "Löscht alle Vorgänge im Papierkorb eines Projekts endgültig. Gibt ihre Anzahl zurück."
  emptyProjectTrash(projectId: ID!): Int!
    @can(ability: "emptyTrash", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\TrashMutations@emptyProjectTrash")
}
