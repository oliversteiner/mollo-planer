# ═══════════════════════════════════════════════════════════════
#  Projektverwaltung · GraphQL-Schema für Laravel Lighthouse
#  Ablage im Projekt: backend/graphql/schema.graphql
# ═══════════════════════════════════════════════════════════════
#
#  Namen      camelCase in GraphQL, snake_case in der Datenbank (@rename)
#  Lesen      Der Scope `visibleToViewer` filtert. Was du nicht sehen
#             darfst, kommt als null bzw. leere Liste zurück.
#  Schreiben  Eine Policy prüft per @can. Ohne Recht gibt es den Fehler
#             "This action is unauthorized."
#
#  Rechte     Eine zentrale Rechte-Tabelle (App\Support\ProjectPermissions)
#             legt fest, welche Projektrolle welche Fähigkeit hat. Alle
#             Policies fragen nur diese Tabelle. Eine neue Einschränkung
#             ändert dort eine Zeile, nicht das Schema. Admins
#             (users.is_admin) dürfen immer alles.
#
#                                 Owner  Manager  Mitglied
#             Projekt ändern        ja     ja       nein
#             Projekt löschen       ja     nein     nein
#             Mitglieder verwalten  ja     ja       nein
#             Milestone anlegen     ja     ja       ja
#             Milestone ändern      ja     ja       ja
#             Milestone löschen     ja     ja       nein
#             ToDo anlegen          ja     ja       ja
#             ToDo ändern           ja     ja       ja
#             ToDo löschen          ja     ja       nein
#             Task anlegen          ja     ja       nein
#             Task ändern           ja     ja       nein
#             Task zuweisen         ja     ja       nein
#             Task verschieben      ja     ja       ja
#             Task löschen          ja     ja       nein
#             Kommentieren          ja     ja       ja
#             Fremde Kommentare
#             löschen               ja     ja       nein
#             Label-Sets verwalten  ja     ja       nein   (in irgendeinem Projekt;
#                                                         eigene Sets ändert der
#                                                         Ersteller oder ein Admin)
#
#             Eigene Kommentare ändern und löschen darf jede Person,
#             solange sie das Projekt sehen darf.
#             Fremde Kommentare ändert niemand, auch kein Admin.
#             Projekte anlegen und Benutzer verwalten dürfen nur Admins.
#  Login      läuft nicht über GraphQL, sondern über Fortify (REST):
#             Login, Logout, Passwort-Reset, 2FA und Passkeys
#  2FA-Pflicht  Eine Middleware in config/lighthouse.php (route.middleware)
#             sperrt die ganze GraphQL-Route, bis die Sitzung stark
#             angemeldet ist: Passwort plus 2FA-Code oder Passkey-Login.
#             Ausserhalb Produktion kann ein Admin die 2FA für alle
#             ausschalten (updateAppSettings), produktiv nie.
#  Status     ToDo und Milestone leiten ihren Status automatisch aus den
#             Tasks bzw. ToDos ab (Observer). Darum gibt es dafür kein
#             Eingabefeld.
#  Mails      Der Server schickt E-Mails (über die Queue, nie im Request):
#             - Neuer Task oder neue Zuweisung: an die zugewiesene Person
#             - Neuer Kommentar: an die zugewiesene Person und alle, die den
#               Task schon kommentiert haben
#             Die Person, die gerade handelt, bekommt nie eine Mail. Wer das
#             Projekt nicht mehr sehen darf, auch nicht. Jede Person kann
#             Mails mit User.notifyByEmail abschalten. Die Sprache der Mails
#             ist die Sprache des Projekts (Project.locale), nicht die der
#             Empfängerin.
#  Beschreibung  Milestone, ToDo und Task haben eine formatierte Beschreibung
#             (Skalar RichText = TipTap-JSON). Das Frontend zeigt sie mit
#             TipTap an, nie mit v-html. So kann kein HTML eingeschleust
#             werden. Kommentare (Comment.body) funktionieren genauso.
#  Avatar     Jede Person kann ein eigenes Avatarbild hochladen (JPG oder
#             PNG, höchstens 5 MB). Der Server schneidet es quadratisch auf
#             500 x 500 Pixel zu und speichert es als WebP ohne Metadaten.
#             Entfernen: die Person selbst oder ein Admin.
#  Icon       Milestone, ToDo und Task haben ein optionales Icon aus Font
#             Awesome Pro, gespeichert nur als Name (rocket). Der Stil ist
#             für die ganze App fest "Duotone Light" und steht im Frontend,
#             nicht in der Datenbank. Der Server prüft nur das Format des
#             Namens, nicht ob das Icon existiert. Die Auswahl übernimmt der
#             Icon-Picker im Frontend.
#  Enums      Die Werte entsprechen den PHP-Enums in App\Enums (gleiche
#             Case-Namen), geprüft von tests/Unit/GraphqlEnumBindingTest.php.

"Datum ohne Uhrzeit, Format YYYY-MM-DD"
scalar Date @scalar(class: "Date")

"Zeitpunkt, Format ISO 8601"
scalar DateTime @scalar(class: "DateTime")

"""
Formatierter Text als TipTap-Dokument (JSON-Objekt mit type "doc"). Der Server
speichert nie HTML, sondern prüft das Dokument gegen eine Whitelist:
Absatz, Überschrift (Ebene 2 und 3), Aufzählung, nummerierte Liste,
Zeilenumbruch, Zitat sowie fett, kursiv und Links (http, https, mailto).
Maximal 20000 Zeichen. Ein Dokument ohne Text wird als null gespeichert.
"""
scalar RichText @scalar(class: "App\\GraphQL\\Scalars\\RichText")

"Datei-Upload (GraphQL multipart request), zum Beispiel mit apollo-upload-client"
scalar Upload @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

# ─── Enums ──────────────────────────────────────────────────────

"Rolle einer Person innerhalb eines Projekts"
enum ProjectRole {
  OWNER @enum(value: "owner")
  MANAGER @enum(value: "manager")
  MEMBER @enum(value: "member")
}

"Sprache eines Projekts. Bestimmt die Sprache der Mails."
enum Locale {
  DE @enum(value: "de")
  EN @enum(value: "en")
}

"Status von Milestone und ToDo (wird automatisch berechnet)"
enum ItemStatus {
  OPEN @enum(value: "open")
  DONE @enum(value: "done")
}

"Fähigkeiten innerhalb eines Projekts. Welche Rolle sie hat, steht in der Rechte-Tabelle."
enum ProjectAbility {
  PROJECT_UPDATE @enum(value: "project.update")
  PROJECT_DELETE @enum(value: "project.delete")
  MEMBERS_MANAGE @enum(value: "members.manage")
  MILESTONE_CREATE @enum(value: "milestone.create")
  MILESTONE_UPDATE @enum(value: "milestone.update")
  MILESTONE_DELETE @enum(value: "milestone.delete")
  TODO_CREATE @enum(value: "todo.create")
  TODO_UPDATE @enum(value: "todo.update")
  TODO_DELETE @enum(value: "todo.delete")
  TASK_CREATE @enum(value: "task.create")
  TASK_UPDATE @enum(value: "task.update")
  TASK_ASSIGN @enum(value: "task.assign")
  TASK_MOVE @enum(value: "task.move")
  TASK_DELETE @enum(value: "task.delete")
  COMMENT_CREATE @enum(value: "comment.create")
  COMMENT_MODERATE @enum(value: "comment.moderate")
  "Eigene Label-Sets anlegen, duplizieren und ändern (gilt, wenn man es in irgendeinem Projekt darf)"
  LABEL_SETS_MANAGE @enum(value: "label_sets.manage")
}

"Farbe eines Labels: ein Farbton der Palette des Themes (hell und dunkel passend)"
enum LabelColor {
  GRAY @enum(value: "gray")
  RED @enum(value: "red")
  ORANGE @enum(value: "orange")
  YELLOW @enum(value: "yellow")
  GREEN @enum(value: "green")
  CYAN @enum(value: "cyan")
  BLUE @enum(value: "blue")
  INDIGO @enum(value: "indigo")
  PURPLE @enum(value: "purple")
  PINK @enum(value: "pink")
}

"Spalten im Kanban-Board"
enum TaskStatus {
  OPEN @enum(value: "open")
  IN_PROGRESS @enum(value: "in_progress")
  REVIEW @enum(value: "review")
  DONE @enum(value: "done")
}

# ─── Typen ──────────────────────────────────────────────────────

"Eine Person mit Zugang. Anlegen und Löschen nur durch Admins."
type User {
  id: ID!
  name: String!
  email: String!
  "Globale Admin-Rolle, unabhängig von Projekten"
  isAdmin: Boolean! @rename(attribute: "is_admin")
  "Will diese Person E-Mail-Benachrichtigungen? Standard: ja. Ändern nur sie selbst."
  notifyByEmail: Boolean! @rename(attribute: "notify_by_email")
  "Adresse des Avatarbilds (500 x 500 Pixel, WebP). null = kein Bild, das Frontend zeigt dann zum Beispiel die Initialen."
  avatarUrl: String @rename(attribute: "avatar_url")
  "Hat die Person eine bestätigte 2FA-App? Nur für dich selbst und für Admins, sonst null."
  twoFactorConfirmed: Boolean @field(resolver: "App\\GraphQL\\Resolvers\\UserSecurity@twoFactorConfirmed")
  "Hat die Person mindestens einen Passkey? Nur für dich selbst und für Admins, sonst null."
  hasPasskey: Boolean @with(relation: "passkeys") @field(resolver: "App\\GraphQL\\Resolvers\\UserSecurity@hasPasskey")
  "Deine Passkeys, neueste zuerst. Nur für dich selbst, sonst null. Hinzufügen und Entfernen über die Passkey-Routen (REST)."
  passkeys: [Passkey!] @field(resolver: "App\\GraphQL\\Resolvers\\UserSecurity@passkeys")
  "Deine Zugänge für Claude (MCP), neueste zuerst. Nur für dich selbst, sonst null."
  apiTokens: [ApiToken!] @field(resolver: "App\\GraphQL\\Resolvers\\UserSecurity@apiTokens")
  "Projekte dieser Person, soweit du sie sehen darfst"
  projects: [Project!]! @field(resolver: "App\\GraphQL\\Resolvers\\UserProjects")
  "Zugewiesene Tasks, soweit du sie sehen darfst"
  assignedTasks: [Task!]! @field(resolver: "App\\GraphQL\\Resolvers\\UserTasks")
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Ein Passkey zum Anmelden, zum Beispiel auf dem Laptop oder im Passwortmanager"
type Passkey {
  id: ID!
  name: String!
  createdAt: DateTime! @rename(attribute: "created_at")
  "null, solange der Passkey noch nie benutzt wurde"
  lastUsedAt: DateTime @rename(attribute: "last_used_at")
}

"Ein persönlicher Zugang für Claude (MCP-Server unter /mcp). Er handelt mit deinen Rechten."
type ApiToken {
  id: ID!
  name: String!
  createdAt: DateTime! @rename(attribute: "created_at")
  "null, solange er noch nie benutzt wurde"
  lastUsedAt: DateTime @rename(attribute: "last_used_at")
  expiresAt: DateTime @rename(attribute: "expires_at")
}

"Ein neu erzeugter Zugang. Den Klartext gibt es nur in dieser Antwort."
type NewApiToken {
  token: ApiToken!
  plainTextToken: String!
}

"Ein Projekt mit Mitgliedern und Milestones"
type Project {
  id: ID!
  name: String!
  description: String
  "Name eines Font-Awesome-Icons (Stil fest im Frontend), z. B. `rocket`. Wird in der Seitenleiste gezeigt."
  icon: String
  "Sprache der Benachrichtigungsmails dieses Projekts"
  locale: Locale!
  "Label-Set der Tasks dieses Projekts. null = keins gewählt."
  labelSet: LabelSet @belongsTo
  members: [ProjectMember!]! @with(relation: "members") @field(resolver: "App\\GraphQL\\Resolvers\\ProjectMembers")
  milestones: [Milestone!]! @hasMany
  "Erledigte Tasks im Verhältnis zu allen Tasks des Projekts"
  progress: Progress! @field(resolver: "App\\GraphQL\\Resolvers\\Progress@project")
  "Deine Rolle im Projekt. null, wenn du nur als Admin Zugriff hast."
  viewerRole: ProjectRole @with(relation: "members") @field(resolver: "App\\GraphQL\\Resolvers\\ViewerRole")
  "Was du in diesem Projekt tun darfst. Das Frontend zeigt danach Knöpfe an oder aus."
  viewerAbilities: [ProjectAbility!]! @with(relation: "members") @field(resolver: "App\\GraphQL\\Resolvers\\ViewerAbilities")
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Mitgliedschaft einer Person in einem Projekt"
type ProjectMember {
  user: User!
  role: ProjectRole!
}

"Ein Meilenstein mit Zieldatum. Er enthält ToDos."
type Milestone {
  id: ID!
  project: Project! @belongsTo
  title: String!
  description: RichText
  "Name eines Font-Awesome-Pro-Icons ohne Stil, zum Beispiel rocket. Der Stil ist fest Duotone Light. null = Standard-Icon des Frontends."
  icon: String
  dueDate: Date @rename(attribute: "due_date")
  "DONE, sobald alle ToDos erledigt sind"
  status: ItemStatus!
  todos: [Todo!]! @hasMany
  progress: Progress! @field(resolver: "App\\GraphQL\\Resolvers\\Progress@milestone")
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Eine Aufgabe auf Planungsebene. Aus ihr entstehen Tasks für die Mitarbeiter."
type Todo {
  id: ID!
  milestone: Milestone! @belongsTo
  title: String!
  description: RichText
  "Name eines Font-Awesome-Pro-Icons ohne Stil, zum Beispiel rocket. Der Stil ist fest Duotone Light. null = Standard-Icon des Frontends."
  icon: String
  dueDate: Date @rename(attribute: "due_date")
  "DONE, sobald alle Tasks erledigt sind"
  status: ItemStatus!
  tasks: [Task!]! @hasMany
  progress: Progress! @field(resolver: "App\\GraphQL\\Resolvers\\Progress@todo")
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Eine Arbeitseinheit für eine Person. Sie erscheint im Kanban."
type Task {
  id: ID!
  todo: Todo! @belongsTo
  title: String!
  description: RichText
  "Name eines Font-Awesome-Pro-Icons ohne Stil, zum Beispiel rocket. Der Stil ist fest Duotone Light. null = Standard-Icon des Frontends."
  icon: String
  status: TaskStatus!
  "Reihenfolge innerhalb der Kanban-Spalte, beginnt bei 0"
  position: Int!
  dueDate: Date @rename(attribute: "due_date")
  assignee: User @belongsTo(relation: "assignee")
  "Kommentare, älteste zuerst (die Relation im Model sortiert nach id)"
  comments: [Comment!]! @hasMany
  commentCount: Int! @count(relation: "comments")
  "Labels des Tasks (nach `position` sortieren für die Reihenfolge des Sets). Kann Labels enthalten, die nach einem Set-Wechsel nicht mehr im Set des Projekts sind."
  labels: [Label!]! @belongsToMany
  createdAt: DateTime! @rename(attribute: "created_at")
}

"Eine Gruppe von Labels, app-weit. Jedes Projekt wählt ein Set."
type LabelSet {
  id: ID!
  "Mitgelieferte Sets: übersetzt nach Accept-Language"
  name: String! @field(resolver: "App\\GraphQL\\Resolvers\\LabelText@setName")
  description: String @field(resolver: "App\\GraphQL\\Resolvers\\LabelText@setDescription")
  "Mitgeliefert: lässt sich nicht ändern, nur duplizieren"
  isBuiltin: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\LabelText@isBuiltin")
  labels: [Label!]! @hasMany
  "Wie viele Projekte das Set gewählt haben. Ein Set in Gebrauch lässt sich nicht löschen."
  usedByProjects: Int! @count(relation: "projects")
  viewerCanUpdate: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\LabelSetViewerCan@update")
  viewerCanDelete: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\LabelSetViewerCan@delete")
}

type Label {
  id: ID!
  "Labels mitgelieferter Sets: übersetzt nach Accept-Language"
  name: String! @field(resolver: "App\\GraphQL\\Resolvers\\LabelText@labelName")
  "Gruppe im Set, zum Beispiel Phase oder Typ"
  category: String @field(resolver: "App\\GraphQL\\Resolvers\\LabelText@labelCategory")
  color: LabelColor!
  "Reihenfolge im Set, beginnt bei 0"
  position: Int!
  labelSet: LabelSet! @belongsTo
}

"Ein Kommentar zu einem Task. Er wird mit dem Task gelöscht."
type Comment {
  id: ID!
  task: Task! @belongsTo
  "null, wenn die Person inzwischen gelöscht wurde"
  author: User @belongsTo(relation: "author")
  "Formatierter Text, gleiche Regeln wie bei den Beschreibungen"
  body: RichText!
  "Darfst du den Text ändern? Nur die Autorin oder der Autor."
  viewerCanEdit: Boolean! @with(relation: "task.todo.milestone.project.members") @field(resolver: "App\\GraphQL\\Resolvers\\CommentViewerCan@edit")
  "Darfst du ihn löschen? Autor oder Owner/Manager des Projekts."
  viewerCanDelete: Boolean! @with(relation: "task.todo.milestone.project.members") @field(resolver: "App\\GraphQL\\Resolvers\\CommentViewerCan@delete")
  createdAt: DateTime! @rename(attribute: "created_at")
  updatedAt: DateTime! @rename(attribute: "updated_at")
}

"Einstellungen der ganzen App. Lesen alle Angemeldeten, ändern nur Admins."
type AppSettings {
  "Braucht die Anmeldung einen zweiten Faktor (2FA-App oder Passkey)? Ohne 2FA genügt das Passwort, und die App fragt nicht nach der Einrichtung."
  twoFactorEnabled: Boolean!
  "Darf twoFactorEnabled hier geändert werden? In Produktion nie, dort ist die 2FA immer Pflicht."
  twoFactorSwitchable: Boolean!
}

"Fortschritt, berechnet aus den Tasks. Wird nicht gespeichert."
type Progress {
  total: Int!
  done: Int!
  "Prozentwert von 0 bis 100, gerundet"
  percent: Int!
}

"Eine Spalte im Kanban-Board mit ihren Tasks"
type KanbanColumn {
  status: TaskStatus!
  tasks: [Task!]!
}

"Alles für die Startseite in einem Aufruf"
type Dashboard {
  "Offene ToDos, nach Fälligkeit sortiert"
  upcomingTodos(limit: Int = 5 @rules(apply: ["integer", "min:1", "max:50"])): [Todo!]! @field(resolver: "App\\GraphQL\\Queries\\Dashboard@upcomingTodos")
  "Deine Tasks, die noch nicht erledigt sind, nach Fälligkeit sortiert"
  myOpenTasks: [Task!]! @field(resolver: "App\\GraphQL\\Queries\\Dashboard@myOpenTasks")
  projects: [Project!]! @all(scopes: ["visibleToViewer"])
}

# ─── KI-Assistent: Projektplan per Chat ─────────────────────────
# Ein Entwurf ist noch nichts in der Datenbank. Beschreibungen sind Klartext:
# Leerzeilen trennen Absätze, Zeilen mit "- " werden eine Liste.

"Antwort des Assistenten: Text für den Chat und der ganze Plan (null, solange er noch Angaben braucht)"
type ProjectPlanDraft {
  reply: String!
  plan: ProjectPlan
}

type ProjectPlan {
  name: String!
  description: String
  locale: Locale!
  members: [ProjectPlanMember!]!
  milestones: [ProjectPlanMilestone!]!
}

type ProjectPlanMember {
  email: String!
  role: ProjectRole!
}

type ProjectPlanMilestone {
  title: String!
  description: String
  dueDate: Date
  todos: [ProjectPlanTodo!]!
}

type ProjectPlanTodo {
  title: String!
  description: String
  dueDate: Date
  tasks: [ProjectPlanTask!]!
}

type ProjectPlanTask {
  title: String!
  description: String
  dueDate: Date
  "E-Mail eines Mitglieds aus members"
  assigneeEmail: String
}

# ─── Abfragen ───────────────────────────────────────────────────

type Query @guard {
  "Der angemeldete Benutzer"
  me: User! @auth

  "Alle Benutzer. Nur für Admins und Projektleiter."
  users: [User!]! @can(ability: "viewAny", model: "App\\Models\\User") @all

  "Deine Projekte. Admins sehen alle."
  projects: [Project!]! @all(scopes: ["visibleToViewer"])
  project(id: ID! @eq): Project @find(scopes: ["visibleToViewer"])

  "Milestones eines Projekts (Seite Milestones)"
  milestones(projectId: ID! @eq(key: "project_id")): [Milestone!]! @all(scopes: ["visibleToViewer"])
  milestone(id: ID! @eq): Milestone @find(scopes: ["visibleToViewer"])

  "ToDos eines Projekts, optional gefiltert (Seite ToDo-Liste)"
  todos(
    projectId: ID! @builder(method: "App\\GraphQL\\Builders\\TodoBuilder@inProject")
    milestoneId: ID @filter(key: "milestone_id")
    status: ItemStatus @filter
  ): [Todo!]! @all(scopes: ["visibleToViewer"])
  todo(id: ID! @eq): Todo @find(scopes: ["visibleToViewer"])

  "Ein einzelner Task mit seinen Kommentaren (Detailansicht im Kanban)"
  task(id: ID! @eq): Task @find(scopes: ["visibleToViewer"])

  "Das Board eines Projekts, Tasks je Spalte nach position sortiert (Seite Kanban)"
  kanban(projectId: ID!): [KanbanColumn!]! @field(resolver: "App\\GraphQL\\Queries\\Kanban")

  "Tasks, die dir zugewiesen sind"
  myTasks(status: TaskStatus @filter): [Task!]! @all(scopes: ["assignedToViewer", "visibleToViewer"])

  "Startseite"
  dashboard: Dashboard! @field(resolver: "App\\GraphQL\\Queries\\Dashboard")
  "Alle Label-Sets (mitgelieferte zuerst, dann eigene nach Name)"
  labelSets: [LabelSet!]! @field(resolver: "App\\GraphQL\\Queries\\LabelSets")
  "Darfst du Label-Sets anlegen und duplizieren? (Admin oder Owner/Manager in irgendeinem Projekt)"
  viewerCanManageLabelSets: Boolean! @field(resolver: "App\\GraphQL\\Queries\\ViewerCanManageLabelSets")
  "Einstellungen der App, zum Beispiel ob die 2FA verlangt wird"
  appSettings: AppSettings! @field(resolver: "App\\GraphQL\\Queries\\AppSettings")
}

# ─── Änderungen ─────────────────────────────────────────────────

type Mutation @guard {
  # Benutzer: nur Admins. Neue Benutzer bekommen eine Einladungsmail
  # mit Link zum Setzen des Passworts.
  createUser(input: CreateUserInput! @spread): User!
    @can(ability: "create", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateUser")
  "Ein Admin kann sich die Admin-Rolle nicht selbst entziehen. Eine geänderte E-Mail darf noch nicht vergeben sein."
  updateUser(id: ID!, input: UpdateUserInput! @spread): User!
    @can(ability: "update", find: "id", injectArgs: true)
    @validator
    @update
  "Entfernt 2FA-Gerät und Passkeys (zum Beispiel bei verlorenem Gerät). Beim nächsten Login wird ein neuer zweiter Faktor eingerichtet."
  resetUserTwoFactor(id: ID!): User!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\ResetUserTwoFactor")
  deleteUser(id: ID! @whereKey): User!
    @can(ability: "delete", find: "id")
    @delete
  "Schaltet die E-Mail-Benachrichtigungen für dich selbst an oder aus"
  updateMyNotifications(emailEnabled: Boolean!): User!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateMyNotifications")

  "Setzt dein Avatarbild: JPG oder PNG, höchstens 5 MB. Es wird quadratisch auf 500 x 500 Pixel zugeschnitten."
  updateMyAvatar(avatar: Upload!): User!
    @validator
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateMyAvatar")
  "Entfernt ein Avatarbild: dein eigenes, als Admin auch das einer anderen Person."
  deleteUserAvatar(id: ID!): User!
    @can(ability: "deleteAvatar", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteUserAvatar")

  "Erzeugt einen Zugang für Claude (MCP), 90 Tage gültig. Den Klartext gibt es nur in der Antwort."
  createApiToken(name: String! @rules(apply: ["min:2", "max:60"])): NewApiToken!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateApiToken")
  "Widerruft einen eigenen Zugang für Claude. null, wenn es ihn nicht (mehr) gibt."
  deleteApiToken(id: ID!): ApiToken
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteApiToken")

  # Einstellungen der App: nur Admins.
  "Schaltet die 2FA für alle an oder aus (aus: Passwort genügt, kein Code). Nur ausserhalb Produktion, sonst ein Validierungsfehler."
  updateAppSettings(twoFactorEnabled: Boolean!): AppSettings!
    @can(ability: "updateAppSettings", model: "App\\Models\\User")
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateAppSettings")

  # Label-Sets: app-weit. Verwalten mit LABEL_SETS_MANAGE in irgendeinem
  # Projekt; eigene Sets ändert und löscht der Ersteller oder ein Admin,
  # mitgelieferte niemand.
  "Legt ein eigenes Label-Set an."
  createLabelSet(input: LabelSetInput!): LabelSet!
    @can(ability: "create", model: "App\\Models\\LabelSet")
    @field(resolver: "App\\GraphQL\\Mutations\\SaveLabelSet@create")
  "Kopiert ein Set (auch ein mitgeliefertes) als eigenes Set, um es anzupassen."
  duplicateLabelSet(id: ID!): LabelSet!
    @can(ability: "duplicate", find: "id", model: "App\\Models\\LabelSet")
    @field(resolver: "App\\GraphQL\\Mutations\\DuplicateLabelSet")
  "Ändert Name, Beschreibung und Labels in einem Zug. Labels mit id bleiben (und an ihren Tasks), ohne id kommen neu dazu, fehlende werden gelöscht (auch an den Tasks)."
  updateLabelSet(id: ID!, input: LabelSetInput!): LabelSet!
    @can(ability: "update", find: "id", model: "App\\Models\\LabelSet")
    @field(resolver: "App\\GraphQL\\Mutations\\SaveLabelSet@update")
  "Löscht ein eigenes Set, das kein Projekt mehr verwendet."
  deleteLabelSet(id: ID!): LabelSet!
    @can(ability: "delete", find: "id", model: "App\\Models\\LabelSet")
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteLabelSet")
  "Wählt das Label-Set eines Projekts (null: keins). Tasks behalten ihre bisherigen Labels."
  setProjectLabelSet(projectId: ID!, labelSetId: ID): Project!
    @can(ability: "update", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\SetProjectLabelSet")
  "Setzt die Labels eines Tasks. Neue Labels müssen aus dem Set des Projekts stammen; bisherige dürfen bleiben."
  setTaskLabels(taskId: ID!, labelIds: [ID!]!): Task!
    @can(ability: "update", find: "taskId", model: "App\\Models\\Task")
    @field(resolver: "App\\GraphQL\\Mutations\\SetTaskLabels")

  # Projekte: Anlegen nur durch Admins, Löschen durch Admin oder Owner.
  createProject(input: CreateProjectInput! @spread): Project!
    @can(ability: "create", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateProject")
  updateProject(id: ID!, input: UpdateProjectInput! @spread): Project!
    @can(ability: "update", find: "id")
    @update
  deleteProject(id: ID! @whereKey): Project!
    @can(ability: "delete", find: "id")
    @delete
  "KI-Assistent (nur Admins): entwirft aus dem Chat einen Projektplan mit Claude. Speichert nichts."
  draftProjectPlan(
    messages: [PlanChatMessageInput!]! @rules(apply: ["min:1", "max:40"])
    "Der Entwurf in der Vorschau, damit Claude ihn ändert statt neu beginnt"
    currentPlan: ProjectPlanInput
  ): ProjectPlanDraft!
    @can(ability: "create", model: "App\\Models\\Project")
    @throttle(name: "plan-assistant")
    @field(resolver: "App\\GraphQL\\Mutations\\DraftProjectPlan")
  "Trägt einen Entwurf ein: Projekt, Mitglieder, Milestones, ToDos, Tasks. Alles oder nichts."
  importProjectPlan(plan: ProjectPlanInput!, notifyAssignees: Boolean = false): Project!
    @can(ability: "create", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\ImportProjectPlan")
  "Fügt eine Person hinzu oder ändert ihre Rolle"
  setProjectMember(projectId: ID!, userId: ID!, role: ProjectRole!): Project!
    @can(ability: "manageMembers", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\SetProjectMember")
  removeProjectMember(projectId: ID!, userId: ID!): Project!
    @can(ability: "manageMembers", find: "projectId", model: "App\\Models\\Project")
    @field(resolver: "App\\GraphQL\\Mutations\\RemoveProjectMember")

  # Milestones, ToDos, Tasks: Wer was darf, steht in der Rechte-Tabelle.
  # Die Ability-Namen sind die Methoden der Policies.
  createMilestone(input: CreateMilestoneInput! @spread): Milestone!
    @can(ability: "createMilestone", find: "project_id", model: "App\\Models\\Project")
    @create
  updateMilestone(id: ID!, input: UpdateMilestoneInput! @spread): Milestone!
    @can(ability: "update", find: "id")
    @update
  deleteMilestone(id: ID! @whereKey): Milestone!
    @can(ability: "delete", find: "id")
    @delete

  createTodo(input: CreateTodoInput! @spread): Todo!
    @can(ability: "createTodo", find: "milestone_id", model: "App\\Models\\Milestone")
    @create
  updateTodo(id: ID!, input: UpdateTodoInput! @spread): Todo!
    @can(ability: "update", find: "id")
    @update
  deleteTodo(id: ID! @whereKey): Todo!
    @can(ability: "delete", find: "id")
    @delete

  "Legt einen Task zu einem ToDo an. Eine zugewiesene Person muss Mitglied des Projekts sein."
  createTask(input: CreateTaskInput! @spread): Task!
    @can(ability: "createTask", find: "todo_id", model: "App\\Models\\Todo")
    @field(resolver: "App\\GraphQL\\Mutations\\CreateTask")
  updateTask(id: ID!, input: UpdateTaskInput! @spread): Task!
    @can(ability: "update", find: "id")
    @update
  "Weist einen Task zu. Ohne assigneeId wird die Zuweisung aufgehoben."
  assignTask(id: ID!, assigneeId: ID): Task!
    @can(ability: "assign", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\AssignTask")
  "Verschiebt einen Task im Kanban"
  moveTask(id: ID!, status: TaskStatus!, position: Int! @rules(apply: ["integer", "min:0"])): Task!
    @can(ability: "move", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTask")
  "Verschiebt einen Task in ein anderes ToDo desselben Projekts (Zeitstrahl). Status von ToDos und Milestones rechnet der Observer nach."
  moveTaskToTodo(id: ID!, todoId: ID!): Task!
    @can(ability: "update", find: "id")
    @field(resolver: "App\\GraphQL\\Mutations\\MoveTaskToTodo")
  deleteTask(id: ID! @whereKey): Task!
    @can(ability: "delete", find: "id")
    @delete

  # Kommentare: Alle Mitglieder dürfen kommentieren. Die Autorin oder der
  # Autor wird aus dem Login gesetzt, nicht aus der Eingabe.
  addComment(input: AddCommentInput! @spread): Comment!
    @can(ability: "createComment", find: "task_id", model: "App\\Models\\Task")
    @field(resolver: "App\\GraphQL\\Mutations\\AddComment")
  updateComment(id: ID!, input: UpdateCommentInput! @spread): Comment!
    @can(ability: "update", find: "id")
    @update
  deleteComment(id: ID! @whereKey): Comment!
    @can(ability: "delete", find: "id")
    @delete
}

# ─── Eingaben ───────────────────────────────────────────────────

input CreateUserInput {
  name: String! @rules(apply: ["min:2", "max:120"])
  email: String! @rules(apply: ["email", "unique:users,email"])
  isAdmin: Boolean = false @rename(attribute: "is_admin")
}

input UpdateUserInput {
  name: String @rules(apply: ["min:2", "max:120"])
  email: String @rules(apply: ["email"])
  isAdmin: Boolean @rename(attribute: "is_admin")
}

input CreateProjectInput {
  name: String! @rules(apply: ["min:2", "max:120"])
  description: String
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  locale: Locale = DE
}

input UpdateProjectInput {
  name: String @rules(apply: ["min:2", "max:120"])
  description: String
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  locale: Locale
}

input CreateMilestoneInput {
  projectId: ID! @rename(attribute: "project_id")
  title: String! @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  dueDate: Date @rename(attribute: "due_date")
}

input UpdateMilestoneInput {
  title: String @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  dueDate: Date @rename(attribute: "due_date")
}

input CreateTodoInput {
  milestoneId: ID! @rename(attribute: "milestone_id")
  title: String! @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  dueDate: Date @rename(attribute: "due_date")
}

input UpdateTodoInput {
  title: String @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  dueDate: Date @rename(attribute: "due_date")
}

input LabelSetInput {
  name: String! @rules(apply: ["min:2", "max:60"])
  description: String @rules(apply: ["max:200"])
  "Höchstens 30 Labels, Namen innerhalb des Sets eindeutig"
  labels: [LabelInput!]! @rulesForArray(apply: ["max:30"])
}

input LabelInput {
  "Bestehendes Label dieses Sets; ohne id wird es neu angelegt"
  id: ID
  name: String! @rules(apply: ["min:1", "max:40"])
  category: String @rules(apply: ["max:40"])
  color: LabelColor!
}

input CreateTaskInput {
  todoId: ID! @rename(attribute: "todo_id")
  title: String! @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  assigneeId: ID @rename(attribute: "assigned_user_id")
  dueDate: Date @rename(attribute: "due_date")
  "Labels aus dem Set des Projekts"
  labelIds: [ID!] @rename(attribute: "label_ids")
}

input UpdateTaskInput {
  title: String @rules(apply: ["min:2", "max:160"])
  description: RichText @rules(apply: ["App\\Rules\\RichTextRule"])
  icon: String @rules(apply: ["App\\Rules\\FontAwesomeIconRule"])
  dueDate: Date @rename(attribute: "due_date")
}

input AddCommentInput {
  taskId: ID! @rename(attribute: "task_id")
  body: RichText! @rules(apply: ["App\\Rules\\RichTextRule", "required"])
}

input UpdateCommentInput {
  body: RichText! @rules(apply: ["App\\Rules\\RichTextRule", "required"])
}

enum PlanChatRole {
  USER
  ASSISTANT
}

input PlanChatMessageInput {
  role: PlanChatRole!
  content: String! @rules(apply: ["min:1", "max:8000"])
}

input ProjectPlanInput {
  name: String! @rules(apply: ["min:2", "max:120"])
  description: String @rules(apply: ["max:2000"])
  locale: Locale = DE
  members: [ProjectPlanMemberInput!]! @rules(apply: ["max:50"])
  milestones: [ProjectPlanMilestoneInput!]! @rules(apply: ["min:1", "max:30"])
}

input ProjectPlanMemberInput {
  email: String! @rules(apply: ["email"])
  role: ProjectRole!
}

input ProjectPlanMilestoneInput {
  title: String! @rules(apply: ["min:2", "max:160"])
  description: String @rules(apply: ["max:5000"])
  dueDate: Date
  todos: [ProjectPlanTodoInput!]! @rules(apply: ["max:50"])
}

input ProjectPlanTodoInput {
  title: String! @rules(apply: ["min:2", "max:160"])
  description: String @rules(apply: ["max:5000"])
  dueDate: Date
  tasks: [ProjectPlanTaskInput!]! @rules(apply: ["max:50"])
}

input ProjectPlanTaskInput {
  title: String! @rules(apply: ["min:2", "max:160"])
  description: String @rules(apply: ["max:5000"])
  dueDate: Date
  assigneeEmail: String @rules(apply: ["nullable", "email"])
}
