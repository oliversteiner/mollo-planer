# ═══════════════════════════════════════════════════════════════
#  Mollo Planer · GraphQL-Schema für Laravel Lighthouse
#  Ablage im Projekt: backend/graphql/schema.graphql
# ═══════════════════════════════════════════════════════════════
#
#  Namen      camelCase in GraphQL, snake_case in der Datenbank (@rename)
#  Lesen      Der Scope `visibleToViewer` filtert. Was du nicht sehen
#             darfst, kommt als null bzw. leere Liste zurück.
#  Schreiben  Eine Policy prüft per @can. Ohne Recht gibt es den Fehler
#             "This action is unauthorized."
#
#  Rechte     Die Rechte stehen in Tabellen (roles, functions, function_rights,
#             role_functions), Standard in config/permissions.php. Alle Policies
#             fragen nur App\Support\Rights. Wer was darf, steht in
#             docs/rollen-funktionen-rechte.md (§5). Admins (Rolle admin,
#             Recht projects.manageAny) dürfen immer alles.
#
#             Eigene Kommentare ändern und löschen darf jede Person,
#             solange sie das Projekt sehen darf.
#             Fremde Kommentare ändert niemand, auch kein Admin.
#             Im Standard dürfen Projekte anlegen: Admin, Projektleitung, Koordination.
#             Benutzer verwalten dürfen im Standard nur Admins.
#  Login      läuft nicht über GraphQL, sondern über Fortify (REST):
#             Login, Logout, Passwort-Reset, 2FA und Passkeys
#  2FA-Pflicht  Eine Middleware in config/lighthouse.php (route.middleware)
#             sperrt die ganze GraphQL-Route, bis die Sitzung stark
#             angemeldet ist: Passwort plus 2FA-Code oder Passkey-Login.
#             Ausserhalb Produktion kann ein Admin die 2FA für alle
#             ausschalten (updateAppSettings), produktiv nie.
#  Status     ToDo und Milestone leiten ihren Status automatisch aus den
#             Tasks bzw. ToDos ab (Observer). Darum gibt es dafür kein
#             Eingabefeld.
#  Mails      Der Server schickt E-Mails (über die Queue, nie im Request):
#             - Neuer Task oder neue Zuweisung: an die zugewiesene Person
#             - Neuer Kommentar: an die zugewiesene Person und alle, die den
#               Task schon kommentiert haben
#             Die Person, die gerade handelt, bekommt nie eine Mail. Wer das
#             Projekt nicht mehr sehen darf, auch nicht. Jede Person kann
#             Mails mit User.notifyByEmail abschalten. Die Sprache der Mails
#             ist die Sprache des Projekts (Project.locale), nicht die der
#             Empfängerin.
#  Beschreibung  Milestone, ToDo und Task haben eine formatierte Beschreibung
#             (Skalar RichText = TipTap-JSON). Das Frontend zeigt sie mit
#             TipTap an, nie mit v-html. So kann kein HTML eingeschleust
#             werden. Kommentare (Comment.body) funktionieren genauso.
#  Avatar     Jede Person kann ein eigenes Avatarbild hochladen (JPG oder
#             PNG, höchstens 5 MB). Der Server schneidet es quadratisch auf
#             500 x 500 Pixel zu und speichert es als WebP ohne Metadaten.
#             Entfernen: die Person selbst oder ein Admin.
#  Icon       Milestone, ToDo und Task haben ein optionales Icon aus Font
#             Awesome Pro, gespeichert nur als Name (rocket). Der Stil ist
#             für die ganze App fest "Duotone Light" und steht im Frontend,
#             nicht in der Datenbank. Der Server prüft nur das Format des
#             Namens, nicht ob das Icon existiert. Die Auswahl übernimmt der
#             Icon-Picker im Frontend.
#  Enums      Die Werte entsprechen den PHP-Enums in App\Enums (gleiche
#             Case-Namen), geprüft von tests/Unit/GraphqlEnumBindingTest.php.

#  Aufbau     Dieses Schema ist in Dateien geteilt, Lighthouse fügt sie per
#             #import zusammen (Reihenfolge egal):
#             scalars.graphql    Skalare (Date, DateTime, RichText, Upload)
#             enums.graphql      Enums (Rollen, Status, Fähigkeiten, Farben)
#             types.graphql      Typen (Benutzer, Projekt, Milestone … Rechte-Tabelle)
#             inputs.graphql     Eingaben (CreateTaskInput …)
#             queries.graphql    Abfragen (type Query)
#             mutations.graphql  Änderungen (type Mutation)
#             plan.graphql       KI-Assistent: Projektplan per Chat

#import scalars.graphql
#import enums.graphql
#import types.graphql
#import plan.graphql
#import inputs.graphql
#import queries.graphql
#import mutations.graphql
