# Enums: Rollen, Status, Rechte-Namen, Farben

# ─── Enums ──────────────────────────────────────────────────────

"Schlüssel der mitgelieferten Projektrollen. Nur noch im alten Projektplan (plan.graphql) verwendet, sonst gilt der Typ Role."
enum ProjectRole {
  OWNER @enum(value: "owner")
  MANAGER @enum(value: "manager")
  MEMBER @enum(value: "member")
  GUEST @enum(value: "guest")
}

"Sprache eines Projekts. Bestimmt die Sprache der Mails."
enum Locale {
  DE @enum(value: "de")
  EN @enum(value: "en")
}

"Status von Milestone und ToDo (wird automatisch berechnet)"
enum ItemStatus {
  OPEN @enum(value: "open")
  DONE @enum(value: "done")
}

"Rechte, die der Code prüft (docs/rollen-funktionen-rechte.md, §4). Projektrechte gelten in einem Projekt, Systemrechte in der ganzen App. Welche Rolle ein Recht hat, steht in den Einstellungen (Rollen und Funktionen)."
enum Right {
  # Projekt
  PROJECT_UPDATE @enum(value: "project.update")
  PROJECT_DELETE @enum(value: "project.delete")
  PROJECT_ARCHIVE @enum(value: "project.archive")
  MEMBERS_MANAGE @enum(value: "members.manage")
  OWNER_MANAGE @enum(value: "owner.manage")
  MILESTONE_CREATE @enum(value: "milestone.create")
  MILESTONE_UPDATE @enum(value: "milestone.update")
  MILESTONE_DELETE @enum(value: "milestone.delete")
  TODO_CREATE @enum(value: "todo.create")
  TODO_UPDATE @enum(value: "todo.update")
  TODO_DELETE @enum(value: "todo.delete")
  TASK_CREATE @enum(value: "task.create")
  TASK_UPDATE @enum(value: "task.update")
  TASK_UPDATE_OWN @enum(value: "task.updateOwn")
  TASK_ASSIGN @enum(value: "task.assign")
  TASK_ASSIGN_SELF @enum(value: "task.assignSelf")
  TASK_MOVE @enum(value: "task.move")
  TASK_DELETE @enum(value: "task.delete")
  COMMENT_CREATE @enum(value: "comment.create")
  COMMENT_MODERATE @enum(value: "comment.moderate")
  TRASH_RESTORE @enum(value: "trash.restore")
  TRASH_PURGE @enum(value: "trash.purge")
  PLANER_EXPORT @enum(value: "planer.export")
  PLANER_IMPORT @enum(value: "planer.import")
  AI_CONTEXT_UPDATE @enum(value: "aiContext.update")
  # System
  PROJECTS_CREATE @enum(value: "projects.create")
  PROJECTS_VIEW_ALL @enum(value: "projects.viewAll")
  PROJECTS_MANAGE_ANY @enum(value: "projects.manageAny")
  USERS_MANAGE @enum(value: "users.manage")
  ROLES_MANAGE @enum(value: "roles.manage")
  TEMPLATES_MANAGE @enum(value: "templates.manage")
  TEMPLATES_MANAGE_ANY @enum(value: "templates.manageAny")
  LABEL_SETS_MANAGE @enum(value: "labelSets.manage")
  LABEL_SETS_MANAGE_ANY @enum(value: "labelSets.manageAny")
  ASSISTANT_USE @enum(value: "assistant.use")
  IDEAS_CREATE @enum(value: "ideas.create")
  IDEAS_VIEW_ANY @enum(value: "ideas.viewAny")
  SETTINGS_MANAGE @enum(value: "settings.manage")
  SYSTEM_VIEW @enum(value: "system.view")
  DATABASE_VIEW @enum(value: "database.view")
}

"Bereich einer Rolle: System (ganze App) oder Projekt (eine Mitgliedschaft)"
enum RoleScope {
  SYSTEM @enum(value: "system")
  PROJECT @enum(value: "project")
}

"Tätigkeit eines Benutzers (zum Beispiel Designer). Nur zur Anzeige, sie gibt keine Rechte."
enum UserActivity {
  DESIGNER @enum(value: "designer")
  ENTWICKLUNG @enum(value: "entwicklung")
  TESTER @enum(value: "tester")
  CONTENT @enum(value: "content")
  TECHNIK @enum(value: "technik")
  VOLUNTEER @enum(value: "volunteer")
}

"Farbe eines Labels: ein Farbton der Palette des Themes (hell und dunkel passend)"
