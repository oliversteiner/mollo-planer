# ─── KI-Assistent: Plan per Chat ────────────────────────────────
# Ein Entwurf ist noch nichts in der Datenbank. Der Plan ist ein Auszug von planer-v2 (kanonischer Text),
# die Vorschau der Trockenlauf des Imports mit appendOnly (docs/auftrag-m6.md §4).

"Welche Art Antwort-Knopf der Assistent anbietet"
enum PlanChoiceKind {
  "Ein vorhandenes Projekt (value = ID)"
  PROJECT
  NEW_PROJECT
  "Eine Vorlage für das neue Projekt (value = ID)"
  TEMPLATE
  NO_TEMPLATE
  "Ein vorhandener Milestone (value = m-<id>)"
  MILESTONE
  NEW_MILESTONE
  CUSTOM_MILESTONE
  "An ein vorhandenes ToDo anhängen (value = t-<id>)"
  APPEND_TO_TODO
  "Als Idee ablegen"
  IDEA
  SHOW_ALL
}

type PlanChoice {
  kind: PlanChoiceKind!
  label: String!
  detail: String
  value: String
  recommended: Boolean!
}

"Antwort des Assistenten"
type PlanDraft {
  "Text für den Chat"
  reply: String!
  "Rückfrage-Knöpfe (höchstens fünf, dann „Alle anzeigen“), sonst leer"
  choices: [PlanChoice!]!
  "Der Auszug als kanonischer Text, null solange Angaben fehlen; geht mit der nächsten Nachricht als currentPlan zurück"
  plan: String
  projectId: ID
  templateId: ID
  "Trockenlauf des Imports mit appendOnly; null ohne Plan"
  preview: ImportResult
  "Hinweise der Nachbearbeitung (unbekannte Person, Duplikat, Beschreibung zu Text geworden …)"
  hints: [String!]!
}

enum PlanChatRole {
  USER
  ASSISTANT
}

input PlanChatMessageInput {
  role: PlanChatRole!
  content: String! @rules(apply: ["min:1", "max:8000"])
}

"Art des Elements, das die Person anlegen will"
enum PlanTargetKind {
  MILESTONE
  TODO
  TASK
}
