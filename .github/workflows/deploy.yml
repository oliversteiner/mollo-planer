name: deploy

# Two environments on the same Hostpoint account (docs/deploy-template.md):
#   push to dev  -> GitHub environment "test"        (planer.mollo.dev, no approval)
#   push to main -> GitHub environment "production"  (planer.mollo.ch, needs the approval of the reviewer)
# Anything else does not deploy. The tests run first in both cases.
#
# What differs per environment comes from the GitHub ENVIRONMENT, not from the repo: the secret DEPLOY_SSH_KEY
# and the variables API_BASE and FRONTEND_URL. DEPLOY_HOST, DEPLOY_USER and DEPLOY_KNOWN_HOSTS are shared
# (same server). The server decides what the key may do: its authorized_keys line points to the deploy.sh of
# ITS environment (command=), so the environment is not chosen here.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (test only from dev, production only from main)'
        type: choice
        options: [test, production]
        required: true

permissions:
  contents: read

env:
  # Host and user come from the repository variables (Settings → Secrets and
  # variables → Actions → Variables), so they are not stored in git.
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}

jobs:
  target:
    name: Target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - name: Pick the environment from the branch
        id: pick
        env:
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.environment }}
        run: |
          case "$REF_NAME" in
            dev) environment=test ;;
            main) environment=production ;;
            *) echo "Branch '$REF_NAME' is not deployed (only dev and main)." >&2; exit 1 ;;
          esac
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$environment" ]; then
            echo "Environment '$REQUESTED' cannot be deployed from branch '$REF_NAME' (dev -> test, main -> production)." >&2
            exit 1
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF_NAME to $environment"

  test-backend:
    name: Tests (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Execute tests
        run: composer test

  test-frontend:
    name: Tests (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Font Awesome registry
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" > .npmrc
          echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> .npmrc
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Web Awesome registry
        run: |
          echo '@web.awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/' >> .npmrc
          echo '//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=${WEBAWESOME_NPM_TOKEN}' >> .npmrc

      - name: Install dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_AUTH_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy (${{ needs.target.outputs.environment }})
    needs: [target, test-backend, test-frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ steps.address.outputs.url }}

    steps:
      # The link of the environment, and a stop when its variables are missing.
      - name: Address of the environment
        id: address
        env:
          API_BASE: ${{ vars.API_BASE }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          if [ -z "$API_BASE" ] || [ -z "$FRONTEND_URL" ]; then
            echo "The variables API_BASE and FRONTEND_URL are missing in the GitHub environment." >&2
            exit 1
          fi
          echo "url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Font Awesome registry
        working-directory: frontend
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" > .npmrc
          echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> .npmrc
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Web Awesome registry
        working-directory: frontend
        run: |
          echo '@web.awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/' >> .npmrc
          echo '//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=${WEBAWESOME_NPM_TOKEN}' >> .npmrc

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_AUTH_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}

      - name: Deploy key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server key is restricted to deploy/deploy.sh: it gets the
      # frontend archive on stdin and runs the deployment, no shell.
      - name: Upload frontend and run deployment
        run: |
          tar -C frontend/.output/public -czf - . \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "$DEPLOY_USER@$DEPLOY_HOST"
