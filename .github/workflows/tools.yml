name: tools

on:
  push:
    paths:
      - 'tools/planer/**'
      - 'spec/**'
      - 'backend/app/Mcp/**'
      - 'backend/app/Planer/**'
      - '.github/workflows/tools.yml'
  # Pull requests: every job runs for every pull request, without a path filter (Auftrag 69 B), so a required check never
  # stays «missing». Pushes (deploy) keep the filter.
  pull_request:

defaults:
  run:
    working-directory: tools/planer

jobs:
  ci:
    name: 'Tools: Planer-Werkzeug'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test planer tools
        run: npm test

  remote:
    name: 'Tools: MCP-Fernzugriff'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --no-suggest

      - name: Test pull, push and sync against the real MCP server
        run: npm run test:remote
