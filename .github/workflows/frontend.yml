name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PRO_ASSETS_TOKEN: ${{ secrets.PRO_ASSETS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Web Awesome Pro comes from its own private registry; the token is the
      # repository secret WEBAWESOME_NPM_AUTH_TOKEN, read from the environment
      # variable WEBAWESOME_NPM_TOKEN (never a file in git).
      - name: Web Awesome registry
        run: |
          echo '@web.awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/' >> .npmrc
          echo '//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=${WEBAWESOME_NPM_TOKEN}' >> .npmrc

      - name: Install dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_AUTH_TOKEN }}

      # Font Awesome Pro icons: from the private repository mollo-pro-assets (secret PRO_ASSETS_TOKEN, read-only, that one
      # repository), fetched on every run (about 2.5 MB). Without the secret (fork, pull request from a fork) nothing is
      # fetched and the build uses Font Awesome Free (scripts/icon-source.mjs). Licensed files never go into the Actions
      # cache or into an artifact: caches can be read from other branches and pull requests (docs/deploy-template.md).
      - name: Font Awesome Pro icons (private repository)
        if: env.PRO_ASSETS_TOKEN != ''
        run: npm run icons:fetch

      - name: No Font Awesome Pro files in git
        run: npm run icons:check

      - name: GraphQL types up to date
        run: |
          npm run codegen
          git diff --exit-code -- app/graphql/generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
